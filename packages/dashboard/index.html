<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#faf8f5" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TraceSketch — Local-First API Flight Recorder &amp; Replay</title>
    <script>
      // Resolve the theme before first paint.
      //
      // Without this the app would always paint light and then snap to dark
      // once React mounted — a white flash on every reload for dark-mode users,
      // and a visible "contradiction" while it happened. This mirrors
      // resolveInitialTheme() in src/context/ThemeContext.tsx; keep the two in
      // sync. Ground colors must match --bg-page in index.css.
      (function () {
        try {
          var stored = localStorage.getItem('tracesketch-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          if (theme === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', theme === 'dark' ? '#0b0c10' : '#faf8f5');
        } catch (e) {
          /* storage blocked: fall back to the light default already in CSS */
        }
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
